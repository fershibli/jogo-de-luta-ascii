name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NAME: Absurdo
  MAIN: absurdo.py

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Python 2.7
        run: choco install python2 -y --no-progress
      - name: Build
        shell: bash
        env:
          PY: /c/Python27/python.exe
          DEPS: "pyinstaller==3.6"
        run: bash .github/scripts/build.sh windows
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*.zip
  release:
    needs: [windows]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
